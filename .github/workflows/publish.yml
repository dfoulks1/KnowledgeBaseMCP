# Publishes to PyPI when a GitHub release is published. No token is stored: PyPI trusted publishing
# (OIDC) proves the upload comes from this workflow. One-time setup is in CONTRIBUTING.md ("Releasing").
name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi  # add required reviewers to this environment to get a manual approval step
    permissions:
      contents: read
      id-token: write  # lets PyPI trust this run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: The tag matches the version in pyproject.toml
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "v$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)" = "$TAG"
      - name: Tests
        run: uv run test_KnowledgeBaseMCP.py
      - name: Build
        run: uv build
      - name: Check the files
        run: uvx twine check dist/*
      - name: Publish
        run: uv publish --trusted-publishing always
