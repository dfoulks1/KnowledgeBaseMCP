[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledgebasemcp"
version = "1.0.0"
description = "An MCP server and CLI for Open Knowledge Format (OKF) v0.2 bundles."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["mcp>=1.10,<2", "pyyaml", "fastembed"]  # fastembed: semantic search, off until `semantic: true`

[project.scripts]
knowledgebasemcp = "KnowledgeBaseMCP:main"

[tool.setuptools]
py-modules = ["KnowledgeBaseMCP"]

# The file still runs as a PEP 723 script (`uv run KnowledgeBaseMCP.py`); the table above
# makes it installable too: `uvx --from git+<repo> knowledgebasemcp`.

[dependency-groups]
dev = ["ruff"]

[tool.ruff]
line-length = 120
