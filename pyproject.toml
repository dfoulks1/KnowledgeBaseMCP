[project]
name = "knowledgebase-mcp"
version = "0.1.0"
description = "An MCP server and CLI for Open Knowledge Format (OKF) v0.2 bundles."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["mcp>=1.10,<2", "pyyaml"]

# The server runs as a self-contained PEP 723 script (see the `# /// script`
# block in KnowledgeBaseMCP.py). This file is for dev tooling and dependency
# declaration, not for packaging the script.

[dependency-groups]
dev = ["ruff"]

[tool.ruff]
line-length = 120
