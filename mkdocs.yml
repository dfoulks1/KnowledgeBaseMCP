site_name: KnowledgeBaseMCP
site_description: >-
  An MCP server and command line for Open Knowledge Format (OKF) v0.2
  knowledgebases, for agents and people alike.
site_author: KnowledgeBaseMCP contributors
copyright: KnowledgeBaseMCP · Apache-2.0 · built under the ASF generative-tooling guidelines · docs AI-generated, under human review
site_url: https://knowledgebasemcp.voltpop.com/

repo_name: dfoulks1/KnowledgeBaseMCP
repo_url: https://github.com/dfoulks1/KnowledgeBaseMCP
edit_uri: edit/main/docs-src/

# Source markdown lives in docs-src/; the built HTML is written into docs/ so
# GitHub Pages can serve it directly from a branch (Settings -> Pages ->
# Deploy from a branch -> main / /docs). No GitHub Actions involved.
# docs-src/CNAME is the Pages custom domain: mkdocs copies it into docs/ on every build
# (the build empties docs/, so a CNAME kept only there would be deleted).
docs_dir: docs-src
site_dir: docs

# Custom theme on Bootstrap 5 (Jinja2 templates in theme/, styles in docs-src/css/).
theme:
  name: null
  custom_dir: theme
  static_templates:
    - 404.html

extra_css:
  - css/pygments.css
  - css/custom.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: "#"
      permalink_title: Link to this section
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      # Lets docs pages pull in repo-root files (e.g. CONTRIBUTING.md) as the
      # single source of truth: use `--8<-- "CONTRIBUTING.md"` in a page.
      base_path:
        - .
        - ..
      check_paths: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Understanding OKF: understanding-okf.md
  - Guide: guide.md
  - Tools: tools.md
  - Contributing: contributing.md
  - AI source material:
      - Context: prompts/00-context.md
      - Rewrite brief: prompts/rewrite-brief.md
  - OKF v0.2: https://github.com/GoogleCloudPlatform/knowledge-catalog/blob/bad9bdbafa82c672b00d437d4f2cc8f17e9e5f58/okf/SPEC.md

plugins: []
